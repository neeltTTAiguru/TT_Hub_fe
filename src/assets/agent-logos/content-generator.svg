<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Content Generator">
  <defs>
    <linearGradient id="cg-body" x1="14" y1="8" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a525e"/>
      <stop offset="1" stop-color="#252a33"/>
    </linearGradient>
    <radialGradient id="cg-lens" cx="0.5" cy="0.42" r="0.62">
